<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Toolbox: scan, edit &amp; sign PDFs</title>
<meta name="description" content="Scan, edit, sign, merge and convert PDFs on Android.">
<link rel="icon" href="icon-512.png">
<style>
:root { color-scheme: dark; --ink: #12080A; --card: #1E1012; --text: #F3E9E9; --muted: #C2AEAE; --red: #FF6A55; --line: #3A2326; }
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(900px 520px at 85% -10%, rgba(224,53,47,.28), transparent 60%),
  radial-gradient(700px 500px at -10% 110%, rgba(122,31,61,.35), transparent 60%), var(--ink);
  min-height: 100vh; color: var(--text); font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 48px 20px 72px; }
a { color: var(--red); }
h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 6px; letter-spacing: -.5px; }
h2 { font-size: 1.2rem; margin: 2.2em 0 .4em; padding-top: 1.2em; border-top: 1px solid var(--line); }
em { color: var(--muted); font-style: normal; }
strong { color: #fff; }
li { margin: .3em 0; }
.brand { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; text-decoration: none; color: var(--text); }
.brand img { width: 52px; height: 52px; border-radius: 14px; }
.brand b { font-size: 1.45rem; letter-spacing: -.3px; }
.brand b span, .hero h1 span { background: linear-gradient(180deg, #FFB199, #FF5A45 60%, #E0352F);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero { text-align: center; padding-top: 64px; }
.hero img { width: 132px; height: 132px; border-radius: 32px; box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 80px rgba(224,53,47,.25); }
.hero h1 { font-size: 3rem; margin-top: 26px; }
.hero p { color: var(--muted); font-size: 1.15rem; max-width: 520px; margin: 8px auto 32px; }
.pills { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
.pills span { padding: 6px 14px; border-radius: 999px; font-size: .9rem; font-weight: 600; color: #FFC2B5;
  background: rgba(255,90,69,.12); border: 1px solid rgba(255,120,100,.4); }
.links a { display: inline-block; padding: 12px 24px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600;
  background: linear-gradient(135deg, #FF6A55, #C62828); box-shadow: 0 10px 30px rgba(224,53,47,.35); }
footer { margin-top: 56px; color: var(--muted); font-size: .9rem; text-align: center; }
</style>
</head>
<body><main>

<section class="hero">
<img src="icon-512.png" alt="PDF Toolbox icon">
<h1>PDF <span>Toolbox</span></h1>
<p>Scan, edit, sign, merge and convert PDFs on your Android phone. Your files stay on your device.</p>
<div class="pills"><span>40+ tools</span><span>No account</span><span>Works offline</span></div>
<div class="links"><a href="privacy.html">Privacy policy</a></div>
</section>
<footer>PDF Toolbox for Android</footer>
</main></body>
</html>
